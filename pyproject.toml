[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-crawler"
dynamic = ["version"]
description = "Crawler thu thập truyện chữ từ các website đọc truyện (TruyenFull, ...) vào SQLite/PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "protego>=0.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
novel-crawler = "novel_crawler.cli:main"

[tool.hatch.version]
path = "src/novel_crawler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/novel_crawler/database/migrations/versions"]  # file do Alembic sinh ra

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # độ dài dòng do `ruff format` lo; E501 chỉ còn bắt comment/chuỗi không tự ngắt được
