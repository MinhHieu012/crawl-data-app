# Cố định tên project: volume luôn là `crawl-data-app_state` dù thư mục chứa file này tên gì.
name: crawl-data-app

services:
  app:
    # VPS: `deploy.sh` ghi APP_IMAGE=ghcr.io/...:<commit> vào .env. Máy cá nhân: `docker compose up -d --build`.
    image: ${APP_IMAGE:-crawl-data-app:local}
    build: .
    restart: unless-stopped
    ports:
      # Chỉ mở trên địa chỉ Tailscale của VPS (KHÔNG để 0.0.0.0): Docker bỏ qua ufw khi publish cổng.
      - "${TAILSCALE_IP:?Đặt TAILSCALE_IP=$(tailscale ip -4) trong file .env cạnh compose.yaml}:8000:8000"
    volumes:
      - state:/srv/state   # .env, data/ (SQLite), logs/

volumes:
  state:
